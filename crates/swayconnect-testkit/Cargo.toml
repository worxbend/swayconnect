[package]
name = "swayconnect-testkit"
description = "Test support for swayconnect: fake sway IPC server, temp directories, fixtures, sealed real session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Runs the tests that start real sway, PipeWire, foot and fuzzel in a sealed session
# (docs/M2C_PLAN.md 3). Only `just real` turns it on; `just ci` never does.
real-backends = ["dep:zbus"]

# A test MPRIS player on the sealed session bus (docs/M2C_PLAN.md 4, slice R2). Cargo puts it
# in the profile directory, where `mpris_test_player()` finds it.
[[bin]]
name = "mpris-test-player"
path = "src/bin/mpris-test-player.rs"
required-features = ["real-backends"]

# The sealed session for a manual walk, with the guard and teardown of `just real`
# (docs/M2C_PLAN.md 3): `just sealed-session`. An example, as it reads the environment.
[[example]]
name = "sealed_session"
required-features = ["real-backends"]

[dependencies]
# Kills the sealed session's process group without `unsafe`.
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
# Only the test MPRIS player uses it; `service` gives the `#[interface]` macro.
zbus = { workspace = true, optional = true, features = ["service"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
