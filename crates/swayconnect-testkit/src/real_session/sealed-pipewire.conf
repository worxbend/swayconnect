# PipeWire of the sealed test session (docs/M2C_PLAN.md 3): one process that also serves
# the PulseAudio protocol (as pipewire-pulse does), on sockets in XDG_RUNTIME_DIR.
# No device of any kind: no ALSA, Bluetooth, V4L2 or libcamera. The null sinks and the
# null source come later from pactl. No realtime module, so no nice or rtkit change.
# The file name matches no drop-in directory of /etc/pipewire or /usr/share/pipewire.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    support.dbus = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    # Without it a client gets no permissions and pactl times out.
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-protocol-pulse }
]
pulse.properties = {
    server.address = [ "unix:native" ]
}
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
]
# The ready signal: PipeWire's stdout is a pipe the harness reads. context.exec runs after
# every module above, the PulseAudio socket included, is loaded.
context.exec = [
    { path = "/bin/sh" args = [ "-c" "echo pipewire-ready" ] }
]
