# Headless sway of the sealed test session (docs/M2C_PLAN.md 3). Nothing from ~/.config.
xwayland disable
swaybg_command -
swaynag_command -
output HEADLESS-1 resolution 1280x720 position 0 0
# The ready signal: sway's stdout is a pipe the harness reads. exec runs after the
# IPC and Wayland sockets listen, and its environment names both.
exec printf 'sway-ready %s %s\n' "$WAYLAND_DISPLAY" "$SWAYSOCK"
