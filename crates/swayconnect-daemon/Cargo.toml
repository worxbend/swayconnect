resvg.workspace = true
rustix.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-client.workspace = true
wayland-protocols-misc.workspace = true
xkeysym.workspace = true
zbus.workspace = true

[dev-dependencies]
swayconnect-cli.workspace = true
swayconnect-testkit.workspace = true
assert_cmd.workspace = true
# Tests decode the standard-base64 fields of protocol/vectors/v1/fingerprint.json.
base64.workspace = true
