[workspace]
resolver = "3"
members = [
    "crates/swayconnect-protocol",
    "crates/swayconnect-sway",
    "crates/swayconnect-daemon",
    "crates/swayconnect-cli",
    "crates/swayconnect-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Versions and features: docs/DESIGN.md 7.3. Only the manifest slice (docs/V2_PLAN.md MAN) edits manifests.
[workspace.dependencies]
swayconnect-protocol = { path = "crates/swayconnect-protocol", version = "0.1.0" }
swayconnect-sway = { path = "crates/swayconnect-sway", version = "0.1.0" }
swayconnect-daemon = { path = "crates/swayconnect-daemon", version = "0.1.0" }
swayconnect-cli = { path = "crates/swayconnect-cli", version = "0.1.0" }
swayconnect-testkit = { path = "crates/swayconnect-testkit" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
# ring provider only: no tls12, no brotli, no aws-lc-rs C build.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# No default features: they pull in the `image` crate. The terminal renderer needs none.
qrcode = { version = "0.14.1", default-features = false }
# Icon rasterising (docs/V2_PLAN.md MAN.1). No default features: no text, fonts, svgz or raster images inside SVG.
resvg = { version = "0.50.0", default-features = false }
tiny-skia = { version = "0.12.0", default-features = false, features = ["png-format"] }
# Resource limits and kill of the raster child without `unsafe`.
rustix = { version = "1.1.6", features = ["fs", "process"] }
# Media players over the session bus (docs/V2_PLAN.md MAN.2). No default features: no async-io runtime, no service side.
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy"] }
# Remote keyboard: zwp_virtual_keyboard_v1 client and keysym names (docs/V2_PLAN.md MAN.2).
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkeysym = "0.2.1"

# Dev only.
tempfile = "3"
assert_cmd = "2"
predicates = "3"
# Not in docs/DESIGN.md 7.3: the identity test of slice S6a must parse the created certificate.
x509-parser = "0.18"
